services:
  - type: web
    name: chartink-dashboard
    runtime: node
    rootDir: chartink-scraper
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: MOMENTUM_SIGNALS
        value: "true"
      - key: CHARTINK_COOKIE
        sync: false
    healthCheckPath: /dashboard/api/signals/status
    autoDeploy: true
