services:
  - type: web
    name: chartink-scraper
    runtime: node
    rootDir: chartink-scraper
    region: oregon
    plan: free
    env: node
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /dashboard

# For Docker deployment, use:
# docker build -t chartink-scraper .
# docker run -p 3000:3000 -e BASE_PATH=/dashboard chartink-scraper
